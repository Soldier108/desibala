<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DesiBala · Launching Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0308;--wine:#5c0a20;--crimson:#7a0c2a;--gold:#e0b255;--gold-soft:#f5dc9c;--mist:#dcc6b8;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ink);color:var(--mist);font-family:Jost,"Segoe UI",system-ui,sans-serif;font-weight:300;overflow-x:hidden;
background-image:radial-gradient(ellipse 60% 45% at 50% 28%,rgba(140,14,48,.6),transparent 72%),radial-gradient(ellipse 90% 60% at 50% 110%,rgba(122,12,42,.35),transparent 70%),radial-gradient(circle at 1px 1px,rgba(224,178,85,.08) 1px,transparent 0);background-size:auto,auto,30px 30px}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px 52px}
.stage{position:relative;width:min(92vw,520px);aspect-ratio:1;perspective:900px}
.mandala{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;animation:fadeIn 2.4s 1.1s ease forwards;transition:transform .3s ease-out;transform:translate(var(--mx,0),var(--my,0))}
.mandala *{fill:none;stroke:var(--gold);stroke-linecap:round}
.petal{fill:rgba(224,178,85,.07)!important;stroke-width:.9}
.thin{stroke-width:.7;opacity:.7}
.ring{stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s 1.2s cubic-bezier(.6,0,.2,1) forwards}
.logo{position:absolute;left:20%;top:20%;width:60%;height:60%;border-radius:50%;opacity:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
box-shadow:0 0 110px rgba(224,178,85,.28),0 0 0 1px rgba(224,178,85,.35),0 26px 60px rgba(0,0,0,.65);animation:bloom 1.6s 1.3s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s ease-out}
.logo img{width:100%;height:100%;display:block;border-radius:50%}
h1{margin:6px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(3.1rem,12vw,6rem);line-height:1.05;color:var(--gold-soft);text-shadow:0 0 38px rgba(224,178,85,.35)}
.ch{display:inline-block;opacity:0;transform:translateY(.45em) scale(.92);filter:blur(8px);animation:ch .9s calc(2.1s + var(--i)*65ms) ease forwards}
.hi{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(1.25rem,4.4vw,1.8rem);color:var(--gold);margin:14px 0 0;letter-spacing:.04em}
.lead{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(1.2rem,3.6vw,1.55rem);line-height:1.5;max-width:30ch;margin:20px auto 0}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:8px 18px;border:1px solid rgba(224,178,85,.35);border-radius:999px;font-size:.95rem;letter-spacing:.06em;color:var(--gold-soft);background:rgba(14,3,8,.5);backdrop-filter:blur(6px)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(224,178,85,.7);animation:pulse 2s infinite}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:11px;padding:14px 26px;border-radius:999px;text-decoration:none;font-size:1.02rem;font-weight:400;letter-spacing:.03em;border:1px solid var(--gold);color:var(--gold-soft);background:rgba(14,3,8,.45);backdrop-filter:blur(6px);transition:background .25s,color .25s,transform .25s,box-shadow .25s}
.btn svg{width:19px;height:19px;flex:none}
.btn:hover{background:var(--gold);color:var(--ink);transform:translateY(-3px);box-shadow:0 10px 30px rgba(224,178,85,.3)}
.btn.solid{background:linear-gradient(120deg,#c8953a,#f5dc9c 50%,#c8953a);color:var(--ink);font-weight:500;border-color:transparent}
.btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:4px}
footer{margin-top:40px;font-size:.9rem;color:rgba(220,198,184,.6);letter-spacing:.1em}
.fade{opacity:0;animation:fadeIn 1.1s var(--t) ease forwards}
.curtain{position:fixed;top:0;bottom:0;width:50.5%;z-index:20;background:repeating-linear-gradient(90deg,#44051a 0 20px,#7a0c2a 20px 44px,#580a20 44px 64px);box-shadow:inset 0 0 90px rgba(0,0,0,.65)}
.curtain.l{left:0;border-right:2px solid var(--gold);animation:partL 2s .5s cubic-bezier(.75,0,.2,1) forwards}
.curtain.r{right:0;border-left:2px solid var(--gold);animation:partR 2s .5s cubic-bezier(.75,0,.2,1) forwards}
.curtain::after{content:"";position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(224,178,85,.18));right:0}
.curtain.r::after{right:auto;left:0;transform:scaleX(-1)}
@keyframes partL{to{transform:translateX(-103%)}}@keyframes partR{to{transform:translateX(103%)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bloom{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}}
@keyframes ch{to{opacity:1;transform:none;filter:none}}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(224,178,85,0)}100%{box-shadow:0 0 0 0 rgba(224,178,85,0)}}
@media(prefers-reduced-motion:reduce){.curtain{display:none}.mandala,.logo,.ch,.fade{animation:none;opacity:1;transform:none;filter:none}.ring{animation:none;stroke-dashoffset:0}.status i{animation:none}}
</style></head><body>
